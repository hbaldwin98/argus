[package]
name = "argus-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The screenshot scenes (`screens`) outside this crate's tests.
scenes = ["dep:png"]

[dependencies]
argus-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The version alacritty uses, so a cell's width here is the daemon's.
unicode-width = "0.2"
# Times said in the person's own zone (`system::clock`).
jiff = "0.2"
# What a link in an agent's Markdown is held to: the host of an http(s) URL, read as the WHATWG
# parser does, which is how the page reads it.
url = "2"
# The editor's text, the one rope the live sync and the Vim layer share; the same pin gpui-kit's
# editor holds, so the build has one. Bytes are its own unit; UTF-16 is converted at the wire
# (`code/wire`).
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
# The screens' browser pictures, for the scenes outside this crate's tests.
png = { version = "0.18", optional = true }

# The build, which says whether Mica and Acrylic are there to offer
# (`settings::backdrop`).
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[dev-dependencies]
# Writes connection/page.rs's types as TypeScript for the page, in test
# builds only; they land in crates/argus-desktop/page/src/bindings
# (`TS_RS_EXPORT_DIR` in .cargo/config.toml).
ts-rs = "12.0.1"
argus-protocol = { workspace = true, features = ["ts"] }
tempfile = { workspace = true }
proptest = { workspace = true }
png = "0.18"

[package]
name = "argus-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argus-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The version alacritty uses, so a cell's width here is the daemon's.
unicode-width = "0.2"

# The build, which says whether Mica and Acrylic are there to offer
# (`settings::backdrop`).
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[dev-dependencies]
# Writes connection/page.rs's types as TypeScript for the page, in test
# builds only; they land in crates/argus-desktop/page/src/bindings
# (`TS_RS_EXPORT_DIR` in .cargo/config.toml).
ts-rs = "12.0.1"
argus-protocol = { workspace = true, features = ["ts"] }
tempfile = { workspace = true }
# The screens' browser pictures, made in the test that writes the scenes.
png = "0.18"

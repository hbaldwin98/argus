[package]
name = "argus-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Named for what `argus desktop-next` opens; the package stays `argus-gpui`.
[[bin]]
name = "argus-desktop-next"
path = "src/main.rs"

# Starts the real platform, which macOS allows only on the main thread (`tests/fonts.rs`).
[[test]]
name = "fonts"
harness = false

# The window's icon, the Tauri window's own: `build.rs` gives the executable it as resource 1,
# which is where the GPUI platform looks for the taskbar's and a shortcut's icon.
[build-dependencies]
embed-resource = "3"

[dependencies]
# Pinned exactly: gpui-kit pins gpui-pre, a weekly snapshot of Zed's main, so
# any other 0.8.x could move the whole GPUI underneath the port. Default
# features only (`component` and `assets`: the styled components and the
# Lucide icons the window controls draw), plus `tree-sitter` for the code
# editor's highlighter: the workspace is on tree-sitter 0.26 (decision 71), so
# this and argusd link one copy of the native library.
gpui-kit = { version = "=0.8.0", features = ["tree-sitter"] }
# The window's logic: the session, the events it publishes and the calls it
# takes (`argus-desktop-core`), and the protocol types they are made of.
argus-desktop-core = { path = "../argus-desktop-core", features = ["grammars"] }
argus-protocol = { workspace = true }
anyhow = { workspace = true }
# The parser and language types a loaded grammar hands the kit's highlighter; the version the kit
# links, which the workspace pins (decision 71).
tree-sitter = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# `Window::render_to_image` returns an `image::RgbaImage`; `png` writes it
# for the screenshots.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# How many cells a character takes, so a tab in a diff line stops at the
# column it would in a terminal and a wide glyph counts for two.
unicode-width = "0.2"
# The clipboard, for pasting a screenshot into a text control, as the Tauri
# window does.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# The day a date field holds, which the date picker is handed and hands back.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The editor's syntax colours, built from the capture table as the kit reads its theme files; and a
# theme's name as the settings file keeps it, in the tests.
serde_json = { workspace = true }

# The window's own handle, which the DWM border colour and Mica's tint are set on (GPUI has no
# call for either); the same version GPUI's `Window` implements `HasWindowHandle` for.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# A Linux desktop is as likely Wayland as X11 now, as the terminal client
# found.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[dev-dependencies]
# `#[gpui_kit::test]`, the headless window and `render_to_image` sit behind
# this feature, from the same pinned source as the normal dependency.
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
proptest = { workspace = true }
# A test's picture is sent as the base64 a shot carries.
base64 = { workspace = true }
# A grammar store of its own for a test that installs one, and the Rust grammar the editor's
# colours are held to.
tempfile = { workspace = true }
tree-sitter-rust = { workspace = true }
# The scenes the Tauri page is photographed in, for the side-by-side shots.
argus-desktop-core = { path = "../argus-desktop-core", features = ["grammars", "scenes"] }

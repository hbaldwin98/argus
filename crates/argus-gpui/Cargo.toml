[package]
name = "argus-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Named for what `argus desktop-next` opens; the package stays `argus-gpui`.
[[bin]]
name = "argus-desktop-next"
path = "src/main.rs"

[dependencies]
# Pinned exactly: gpui-kit pins gpui-pre, a weekly snapshot of Zed's main, so
# any other 0.8.x could move the whole GPUI underneath the port. Default
# features only (`component` and `assets`: the styled components and the
# Lucide icons the window controls draw). The `tree-sitter*` features are
# left off until the editor track picks its grammars; they pull the
# `tree-sitter` native library, which the workspace already links once.
gpui-kit = "=0.8.0"
# The window's logic: the session, the events it publishes and the calls it
# takes (`argus-desktop-core`), and the protocol types they are made of.
argus-desktop-core = { path = "../argus-desktop-core" }
argus-protocol = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# `Window::render_to_image` returns an `image::RgbaImage`; `png` writes it
# for the screenshots.
image = { version = "0.25", default-features = false, features = ["png"] }
# How many cells a character takes, so a tab in a diff line stops at the
# column it would in a terminal and a wide glyph counts for two.
unicode-width = "0.2"
# The clipboard, for pasting a screenshot into a text control, as the Tauri
# window does.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# The day a date field holds, which the date picker is handed and hands back.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# The window's own handle, which the DWM border colour and Mica's tint are set on (GPUI has no
# call for either); the same version GPUI's `Window` implements `HasWindowHandle` for.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# A Linux desktop is as likely Wayland as X11 now, as the terminal client
# found.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[dev-dependencies]
# `#[gpui_kit::test]`, the headless window and `render_to_image` sit behind
# this feature, from the same pinned source as the normal dependency.
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
proptest = { workspace = true }
# A theme's name as the settings file keeps it, to hold the data to the stylesheet.
serde_json = { workspace = true }
# The scenes the Tauri page is photographed in, for the side-by-side shots.
argus-desktop-core = { path = "../argus-desktop-core", features = ["scenes"] }

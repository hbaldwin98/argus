[package]
name = "argus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argus-protocol = { workspace = true }
# No `common-controls-v6`: it links TaskDialogIndirect, whose manifest only
# the [[bin]] gets, so the bin's test harness fails to start on MSVC.
tauri = { version = "2.12.3", default-features = false, features = ["wry", "compression", "x11", "dbus", "custom-protocol"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The clipboard's text, read and written in Rust rather than by the page:
# a webview's clipboard API wants a user gesture that a copy finished over
# IPC no longer has.
arboard = { version = "3", default-features = false }
# The version alacritty uses, so a cell's width here is the daemon's.
unicode-width = "0.2"

# A Linux desktop is as likely Wayland as X11 now, as the terminal client
# found.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
# Writes page.rs's types as TypeScript for the page, in test builds only.
ts-rs = "12.0.1"

[build-dependencies]
tauri-build = "2.7.2"

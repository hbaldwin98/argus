<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Argus</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <div class="split">
    <nav class="rail" aria-label="Argus">
      <div class="rail-sash" id="rail-sash" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" title="Drag to resize; double-click for the usual width"></div>
      <div class="brand drag">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="fg-accent"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><circle cx="8" cy="8" r="2.2" fill="currentColor"></circle></svg>
        <div class="projmenu" id="heading"></div>
      </div>
      <div class="navs">
        <button class="search" id="nav-search" title="Search">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
          <span class="grow">Search</span>
          <span id="nav-search-keys"></span>
        </button>
        <button class="nav" id="nav-new" title="New">
          <span class="ic new"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg></span>
          <span class="grow">New</span>
          <span id="nav-new-keys"></span>
        </button>
        <button class="nav" id="nav-workspace" title="Workspace">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="2"></rect><path d="M5 7l2 1.5L5 10M8.5 10.5H11"></path></svg></span>
          <span class="grow">Workspace</span>
          <span id="nav-workspace-keys"></span>
        </button>
        <button class="nav" id="nav-feature" title="Features">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8M6 8h8M6 12h8"></path><path d="M2 4l1 1 1.5-2M2 8l1 1 1.5-2"></path><circle cx="3" cy="12" r="0.8"></circle></svg></span>
          <span class="grow">Features</span>
          <span id="nav-feature-keys"></span>
        </button>
        <button class="nav" id="nav-checkouts" title="Checkouts">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.5" r="1.5"></circle><circle cx="4.5" cy="12.5" r="1.5"></circle><circle cx="11.5" cy="5.5" r="1.5"></circle><path d="M4.5 5v6M11.5 7c0 3-7 2-7 4"></path></svg></span>
          <span class="grow">Checkouts</span>
          <span id="nav-checkouts-keys"></span>
        </button>
        <button class="nav" id="nav-code" title="Code">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"></path></svg></span>
          <span class="grow">Code</span>
          <span id="nav-code-keys"></span>
        </button>
        <button class="nav" id="nav-console" title="Console">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3.5 3.5L3 11.5M8 12h5"></path></svg></span>
          <span class="grow">Console</span>
          <span id="nav-console-keys"></span>
        </button>
        <div class="nav-extensions" id="nav-extensions"></div>
        <div class="nav-extensions" id="nav-saved"></div>
      </div>
      <div class="rail-list" id="rail"></div>
      <footer class="bar" id="bar"></footer>
    </nav>
    <main class="stage">
      <div class="strip drag" id="strip">
        <div class="head" id="head"></div>
        <div class="strip-tools"><button class="btn vlauncher" id="views-tab" type="button" title="Views agents showed" hidden></button><span id="head-more"></span></div>
        <div class="winbtns" id="winbtns">
          <button class="winbtn" id="win-min" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"></path></svg></button>
          <button class="winbtn" id="win-max" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="currentColor"><rect class="max" x="0.5" y="0.5" width="9" height="9"></rect><path class="restore" d="M2.5 2.5V0.5h7v7h-2M0.5 2.5h7v7h-7z"></path></svg></button>
          <button class="winbtn shut" id="win-close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></button>
        </div>
      </div>
      <div class="work" id="work">
        <div class="dock dock-left" id="dock-left" hidden>
          <div class="dock-sash" id="dock-left-sash" role="separator" aria-orientation="vertical" aria-label="Resize the left dock"></div>
          <div class="dock-tabs" id="dock-left-tabs" role="tablist" aria-label="Left dock" hidden></div>
          <div class="dock-body" id="dock-left-body"></div>
        </div>
        <div class="center" id="center">
          <div class="fstage" id="fstage" hidden></div>
          <div class="fstage cstage" id="cstage" hidden></div>
          <div class="fstage kstage" id="kstage" hidden></div>
          <div class="fstage xstage" id="xstage" hidden></div>
          <div class="fstage vstage" id="vstage" hidden></div>
          <div class="nstage" id="nstage" hidden></div>
          <div class="stage-body" id="body">
            <div class="split" id="split" hidden>
              <div class="gcell" id="gcell-0">
                <div class="terminal" id="terminal" hidden>
                  <textarea id="input" aria-label="Type into the pane" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
                </div>
              </div>
            </div>
            <div class="empty" id="empty"></div>
            <div class="ended" id="ended" hidden></div>
          </div>
          <div class="sash" id="dock-bottom-sash" role="separator" aria-orientation="horizontal" aria-label="Resize the bottom dock" hidden></div>
          <div class="dock dock-bottom" id="dock-bottom" hidden>
            <div class="dock-tabs" id="dock-bottom-tabs" role="tablist" aria-label="Bottom dock" hidden></div>
            <div class="dock-body" id="dock-bottom-body"></div>
          </div>
          <section class="console" id="console" aria-label="Console" hidden>
            <div class="chead" id="console-head"></div>
            <div class="cbody" id="console-body">
              <div class="cside" id="console-first" hidden>
                <div class="thead" id="console-first-head" hidden></div>
                <div class="terminal" id="terminal-console"></div>
              </div>
              <div class="cside" id="console-second" hidden>
                <div class="thead" id="console-second-head"></div>
                <div class="terminal" id="terminal-beside"></div>
              </div>
              <div class="empty" id="console-empty"></div>
            </div>
          </section>
        </div>
        <div class="dock dock-right" id="dock-right" hidden>
          <div class="dock-sash" id="dock-right-sash" role="separator" aria-orientation="vertical" aria-label="Resize the right dock"></div>
          <div class="dock-tabs" id="dock-right-tabs" role="tablist" aria-label="Right dock" hidden></div>
          <div class="dock-body" id="dock-right-body"></div>
        </div>
        <div class="floats" id="floats"></div>
      </div>
    </main>
    <div class="parked" id="parked">
      <section class="vpanel" id="views" aria-label="Views agents showed">
        <div class="vpanel-inner" id="views-inner"></div>
      </section>
    </div>
  </div>
  <div class="notice" id="notice" role="status" hidden></div>
  <div class="review-layer" id="history" hidden></div>
  <div class="review-layer" id="sessions" hidden></div>
  <div class="review-layer" id="addproject" hidden></div>
  <div class="review-layer" id="review" hidden></div>
  <div class="review-layer" id="link" hidden></div>
  <div class="review-layer" id="reconcile" hidden></div>
  <div class="layer" id="layer"></div>
  <div class="ext-dialogs" id="ext-dialog"></div>
  <div class="layer over" id="over"></div>
  <div class="overlay" id="stopped" hidden>
    <section class="card stopped-card" role="alertdialog" aria-modal="true" aria-labelledby="stopped-title">
      <svg class="stopped-icon" width="28" height="28" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="4.5" rx="1.2"></rect><rect x="2.5" y="9" width="11" height="4.5" rx="1.2"></rect><path d="M5 4.75h.01M5 11.25h.01"></path></svg>
      <div class="type-title" id="stopped-title">argusd was stopped</div>
      <div class="fg-muted">Someone ran <span class="fg mono">argus server stop</span>. Its panes ended with it; this is the last tree it sent.</div>
      <button class="btn primary" id="reconnect">Reconnect</button>
    </section>
  </div>
</div>
</body>
</html>

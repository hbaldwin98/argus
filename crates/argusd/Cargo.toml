[package]
name = "argusd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "argusd"
path = "src/main.rs"

# The command Argus writes into managed agent hooks. Separate binary so a
# hook never depends on a shell, and never reports failure. See harness/mod.rs.
[[bin]]
name = "argus-hook"
path = "src/bin/argus-hook/main.rs"

[dependencies]
argus-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
portable-pty = { workspace = true }
alacritty_terminal = { workspace = true }
git2 = { workspace = true }
ignore = "0.4"
regex = "1"
notify = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-yaml = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-md = { workspace = true }
# The pane API's DevTools socket, which an agent's browser tool attaches to
# its pane's browser by. Loopback only, so no TLS.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# A tab's picture, which DevTools answers as base64, written out as the PNG
# an agent's `browser shot` reads.
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading", "Wdk_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
rmp-serde = { workspace = true }
# SQLite's update, progress and commit hooks, which store::faults injects
# faults through. A test build's only: resolver 2 keeps a dev-dependency's
# features out of the daemon itself.
rusqlite = { workspace = true, features = ["hooks"] }

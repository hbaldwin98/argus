[package]
name = "argusd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "argusd"
path = "src/main.rs"

# The command Argus writes into managed agent hooks. Separate binary so a
# hook never depends on a shell, and never reports failure. See hooks.rs.
[[bin]]
name = "argus-hook"
path = "src/bin/argus-hook.rs"

[dependencies]
argus-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
git2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

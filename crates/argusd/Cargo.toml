[package]
name = "argusd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "argusd"
path = "src/main.rs"

# The command Argus writes into managed agent hooks. Separate binary so a
# hook never depends on a shell, and never reports failure. See harness.rs.
[[bin]]
name = "argus-hook"
path = "src/bin/argus-hook.rs"

[dependencies]
argus-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
git2 = { workspace = true }
ignore = "0.4"
notify = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-yaml = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-md = { workspace = true }

[dev-dependencies]

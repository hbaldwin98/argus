[workspace]
resolver = "2"
members = [
    "crates/argus-protocol",
    "crates/argusd",
    "crates/argus-client",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hbaldwin98/argus"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
compact_str = { version = "0.8", features = ["serde"] }
anyhow = "1"
thiserror = "1"
directories = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argus-protocol = { path = "crates/argus-protocol" }
portable-pty = "0.8"
vt100 = "0.15"
git2 = { version = "0.19", features = ["vendored-openssl"] }
ratatui = "0.28"
crossterm = "0.28"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

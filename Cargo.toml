[workspace]
resolver = "2"
members = [
    "crates/argus-protocol",
    "crates/argusd",
    "crates/argus-client",
    "crates/argus-desktop-core",
    "crates/argus-desktop",
    "crates/argus-gpui",
]
# The vendored gpui-base the GPUI window is patched onto: a patch, not a member, so `--workspace`
# neither builds nor lints it as Argus's own code (`patches/gpui-base/README.md`).
exclude = ["patches/gpui-base"]
# The desktop window links WebKitGTK on Linux and brings ~250 crates of its
# own, so a plain `cargo build` or `cargo test` leaves it out; `--workspace`
# or `-p argus-desktop` builds it. `argus-gpui` is out for the same reason: it
# brings GPUI's crates, so it builds with `--workspace` or `-p argus-gpui`.
# `argus-desktop-core` has no webview, so it is built by default.
default-members = [
    "crates/argus-protocol",
    "crates/argusd",
    "crates/argus-client",
    "crates/argus-desktop-core",
]

[workspace.package]
version = "0.39.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hbaldwin98/argus"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
compact_str = { version = "0.10", features = ["serde"] }
anyhow = "1"
thiserror = "2"
directories = "6"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argus-protocol = { path = "crates/argus-protocol" }
portable-pty = "0.9"
alacritty_terminal = "0.26"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
ratatui = "0.30"
crossterm = "0.29"
base64 = "0.23"
tempfile = "3"
proptest = "1"
insta = { version = "1", default-features = false }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
similar = "2.7"
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
# Downloads over HTTPS in this process, checked against the operating system's certificates: the
# client's updates and the window's grammars.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11.1"
windows-sys = "0.61"
libc = "0.2"

# Full debug info made each argusd test binary's .pdb about 180 MB, and
# linking it dominated a rebuild. Line tables keep file and line in panics
# and backtraces; a debugger session wants `debug = true` back locally.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# gpui-kit pins gpui-base, whose editor has no way to apply an agent's edit without moving the
# person's cursor or entering undo, and no gutter marks: `patches/gpui-base` is 0.8.0 plus those
# two additions, small enough to offer upstream (`patches/gpui-base/README.md`, `GPUI.md`).
[patch.crates-io]
gpui-base = { path = "patches/gpui-base" }

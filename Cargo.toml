[workspace]
resolver = "2"
members = [
    "crates/argus-protocol",
    "crates/argusd",
    "crates/argus-client",
    "crates/argus-web",
]

[workspace.package]
version = "0.26.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hbaldwin98/argus"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
compact_str = { version = "0.10", features = ["serde"] }
anyhow = "1"
thiserror = "2"
directories = "6"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argus-protocol = { path = "crates/argus-protocol" }
argus-web = { path = "crates/argus-web" }
portable-pty = "0.9"
alacritty_terminal = "0.26"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
ratatui = "0.30"
crossterm = "0.29"
base64 = "0.23"
tempfile = "3"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
windows-sys = "0.61"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Read by ts-rs when `cargo test -p argus-desktop-core` writes the page's
# TypeScript types from crates/argus-desktop-core/src/connection/page.rs: ids
# travel as JSON numbers, not bigints, and the types land beside the
# page's own sources.
[env]
TS_RS_LARGE_INT = "number"
TS_RS_EXPORT_DIR = { value = "crates/argus-desktop/page/src/bindings", relative = true }

# The LLD that ships with the toolchain links a one-line change to the
# desktop window in about 3.1s against link.exe's 4.8s, and argusd's tests
# in 3.5s against 4.0s. It embeds Tauri's manifest and resources the same.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

name: reliab

# The agent-free gates of reliab's testing contract (reliability-profile.yaml).
# In a session they are hooks, which a bypassed permission weakens; here they
# are authoritative.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliab-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepr:
    name: Pre-PR tier
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      # Full history: the tier diffs against a base for its relevance skips
      # and mutation_changed takes the merge base with origin/main.
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      # The same packages as ci.yml's: the build step builds the whole
      # workspace, the GPUI window included.
      - name: Install the desktop windows' libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libasound2-dev cmake

      # The versions the profile's roles T1 and T4 were verified with.
      # taiki-e/install-action refuses to run on this image, which exports a
      # bash function into the environment. nextest comes from its release,
      # checked against this hash; cargo-mutants' release binary needs a
      # newer glibc than 22.04's, so it is built, its lockfile held to.
      - name: Install cargo-nextest and cargo-mutants
        shell: bash
        run: |
          get() {
            curl -fsSL -o "$RUNNER_TEMP/$1.tgz" "$2"
            echo "$3  $RUNNER_TEMP/$1.tgz" | sha256sum -c -
            tar xzf "$RUNNER_TEMP/$1.tgz" -C "$HOME/.cargo/bin"
          }
          get nextest https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
          cargo install cargo-mutants --version 27.1.0 --locked
          cargo nextest --version
          cargo mutants --version

      - name: Install reliab
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/hbaldwin98/reliab/main/scripts/install.sh | sh -s -- "$(cat .reliab-version)"
          echo "$HOME/.reliab/bin" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A push to main has no merge base of its own to judge relevance
      # against, so it uses the commit the push replaced; a new branch's
      # first push has none and runs every layer.
      - name: Run the pre-PR tier
        shell: bash
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            reliab verify --tier prepr --base "$BEFORE"
          else
            reliab verify --tier prepr
          fi

      - name: Summarize
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          reliab report summary | tee -a "$GITHUB_STEP_SUMMARY"
          reliab report export --format junit -o reliab-report.xml

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reliab-report
          path: |
            reliab-report.xml
            .reliab/reports/
            .reliab/out/
          include-hidden-files: true

  # Protected oracles (snapshots, regression seeds, the profile) change only
  # with a person's approval. Approvals live in a local .reliab/, so here
  # every protected change fails: the reviewer approving the pull request is
  # that person.
  protected:
    name: Protected paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install reliab
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/hbaldwin98/reliab/main/scripts/install.sh | sh -s -- "$(cat .reliab-version)"
          echo "$HOME/.reliab/bin" >> "$GITHUB_PATH"

      - name: List protected changes
        run: reliab gate protected --base origin/${{ github.base_ref }}

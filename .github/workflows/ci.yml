name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this workflow as its gate, so a tag is held to the same
  # matrix as a push and the two cannot drift.
  workflow_call:

permissions:
  contents: read

# Inside a called workflow `github.workflow` and `github.ref` are the caller's,
# so a release groups as `ci-Release-refs/tags/vX` and never shares a group
# with a push or pull request run (`ci-CI-refs/heads/...`, `ci-CI-refs/pull/...`).
# A tag's run is never cancelled: a half-gated release is worse than a slow one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
          - name: macOS arm64
            runner: macos-15
          - name: Windows x86_64
            runner: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      # The desktop crate links WebKitGTK on Linux; nothing else needs it,
      # and macOS and Windows bring their own webview.
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config

      # Nearly all of a run is compiling dependencies that did not change,
      # most of them vendored C: libgit2, SQLite, the tree-sitter grammars.
      # Only main saves, so a pull request or a tag reads main's cache and
      # cannot fill the repository's quota with its own.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test workspace
        run: cargo test --workspace --locked

      # `cargo test` writes the desktop page's TypeScript types from
      # crates/argus-desktop/src/connection/page.rs; what is committed has
      # to be what it writes, or the page compiles against a contract Rust
      # no longer keeps. Checked on one platform: the output is the same on
      # each.
      - name: Check the page's bindings match connection/page.rs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          changed="$(git status --porcelain -- crates/argus-desktop/page/src/bindings)"
          if [[ -n "$changed" ]]; then
            echo "$changed"
            echo "run cargo test -p argus-desktop and commit page/src/bindings" >&2
            exit 1
          fi

      # Runs after a failed test step too, so one run reports both.
      - name: Lint workspace
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The desktop window's page is TypeScript compiled into
  # crates/argus-desktop/assets/js, which is committed so building the crate
  # needs no Node. This holds the committed output to its sources, and the
  # sources and the stylesheet to the linter and the formatter.
  page:
    name: Desktop page
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/argus-desktop/page
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/argus-desktop/page/package-lock.json

      - name: Install the page's tools
        run: npm ci

      - name: Compile, lint and check formatting
        run: npm run check

      # Node strips the types from the modules that import nothing but
      # types, so those run as written; the rest touch the document on load.
      - name: Test the page's DOM-free modules
        run: npm test

      - name: Check the committed page is what its sources compile to
        shell: bash
        run: |
          changed="$(git status --porcelain -- ../assets/js)"
          if [[ -n "$changed" ]]; then
            echo "$changed"
            echo "run npm run build in crates/argus-desktop/page and commit assets/js" >&2
            exit 1
          fi


name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release calls this workflow as its gate, so a tag is held to the same
  # matrix as a push and the two cannot drift.
  workflow_call:

permissions:
  contents: read

# Inside a called workflow `github.workflow` and `github.ref` are the caller's,
# so a release groups as `ci-Release-refs/tags/vX` and never shares a group
# with a push or pull request run (`ci-CI-refs/heads/...`, `ci-CI-refs/pull/...`).
# A tag's run is never cancelled: a half-gated release is worse than a slow one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
          - name: macOS arm64
            runner: macos-15
          - name: Windows x86_64
            runner: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      # Nearly all of a run is compiling dependencies that did not change,
      # most of them vendored C: libgit2, SQLite, the tree-sitter grammars.
      # Only main saves, so a pull request or a tag reads main's cache and
      # cannot fill the repository's quota with its own.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test workspace
        run: cargo test --workspace --locked

      # Runs after a failed test step too, so one run reports both.
      - name: Lint workspace
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify version tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Match tag to workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read workspace.package.version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The whole CI matrix, not a Linux-only copy of it: a tag publishes a
  # package for every platform, so every platform has to pass first. The
  # packages build beside it, and only publishing waits for both.
  quality:
    name: Verify release behavior
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            format: tar
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar
          # Cross-built on Apple Silicon: the Intel runner took 54 minutes of the job's hour for
          # 0.43.0, against 20 here. transcribe.cpp builds for the target with a fixed x86_64 floor.
          - runner: macos-15
            target: x86_64-apple-darwin
            format: tar
          - runner: macos-15
            target: aarch64-apple-darwin
            format: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            format: zip

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      # The desktop crate links WebKitGTK on Linux, and the GPUI window
      # (argus-gpui) links fontconfig, xkbcommon, xcb and wayland; nothing else
      # needs them, and macOS and Windows bring their own webview and text.
      # Dictation (argus-dictation) reads the microphone through ALSA and builds
      # transcribe.cpp with CMake.
      - name: Install desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libasound2-dev cmake

      - name: Build release binaries
        # Only Windows keeps the line tables, in .pdb files shipped apart from the archive. On Linux
        # they are inside the executables and tripled its archives (47 MB to 138 MB for 0.42.2); a
        # macOS backtrace cannot read them, and they took its fat-LTO build past the job's hour.
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ runner.os == 'Windows' && 'line-tables-only' || 'false' }}
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package Unix binaries
        if: matrix.format == 'tar'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          package="argus-$VERSION-$TARGET"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/argus" "dist/$package/"
          cp "target/$TARGET/release/argusd" "dist/$package/"
          cp "target/$TARGET/release/argus-hook" "dist/$package/"
          cp "target/$TARGET/release/argus-desktop" "dist/$package/"
          cp "target/$TARGET/release/argus-desktop-next" "dist/$package/"
          cp README.md ARCHITECTURE.md TARGET.md ROADMAP.md LICENSE-MIT LICENSE-APACHE "dist/$package/"
          cp -R docs "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Package Windows binaries
        if: matrix.format == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $package = "argus-$env:VERSION-$env:TARGET"
          $packageDir = Join-Path "dist" $package
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/argus.exe" $packageDir
          Copy-Item "target/$env:TARGET/release/argusd.exe" $packageDir
          Copy-Item "target/$env:TARGET/release/argus-hook.exe" $packageDir
          Copy-Item "target/$env:TARGET/release/argus-desktop.exe" $packageDir
          Copy-Item "target/$env:TARGET/release/argus-desktop-next.exe" $packageDir
          Copy-Item README.md, ARCHITECTURE.md, TARGET.md, ROADMAP.md, LICENSE-MIT, LICENSE-APACHE $packageDir
          Copy-Item docs -Destination $packageDir -Recurse
          $archive = Join-Path "dist" "$package.zip"
          Compress-Archive -Path $packageDir -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "$archive.sha256"
          # The symbols, apart so an update does not download them: a crash log's offsets are read
          # against them by `scripts/symbolize.ps1`.
          $symbols = Join-Path "dist" "$package-symbols.zip"
          Compress-Archive -Path "target/$env:TARGET/release/*.pdb" -DestinationPath $symbols

      - name: Upload packaged release
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify, quality, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Argus $VERSION"

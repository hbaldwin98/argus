# reliab stack profile for argus. See https://github.com/hbaldwin98/reliab
# Every filling is a claim until stage S0 verifies it on this codebase.
schemaVersion: 0.1.0
name: rust-workspace
starting_condition: maintained
verified_on: 2026-10-17

runtime:
  current: rust-stable

# A file matching none of these counts as product.
paths:
  product: ["crates/**", "Cargo.toml", "Cargo.lock"]
  tests: ["**/tests/**", "**/tests.rs", "fuzz/**", ".config/nextest.toml"]
  ignore: ["*.md", "LICENSE-*", "crates/argus-desktop/page/src/bindings/**", "crates/argus-desktop/assets/js/**"]

# Oracles that change only with human approval (R2). The profile is one: it
# holds the mutation threshold and what each layer is relevant to.
protected_paths:
  - "reliability-profile.yaml"
  - "**/proptest-regressions/**"
  - "crates/argusd/tests/fixtures/stores/**"
  - "**/snapshots/**"
  - "mutants.toml"

# Commands that approve an oracle without naming its path: insta's review and
# accept, and any INSTA_UPDATE that writes snapshots (sh or PowerShell
# spelling). INSTA_UPDATE=no, which only checks, stays allowed.
protected_commands:
  - '\bcargo\s+insta\s+(accept|review)\b'
  - 'INSTA_UPDATE\s*=\s*[''"]?(always|auto|new|unseen)'

freshness_exclude: ["*.md"]

roles:
  T1: { tool: cargo-nextest, version: "0.9.148", verified: 2026-10-17, notes: "3306 tests in ~30s warm; JUnit via .config/nextest.toml profiles ci and props" }
  T2: { tool: proptest, verified: 2026-10-17, notes: "properties live in `mod properties` (10 today, all in argus-protocol); failing cases are saved under proptest-regressions/" }
  T3: { tool: insta, version: "1.49.0", verified: 2026-10-18, notes: "request/response transcripts over the IPC socket, five conversations in crates/argusd/src/test_host/tests; scrubbed and rendered by test_host::{scrub,render}, so a capture is plain text apart from insta" }
  T4: { tool: cargo-mutants, version: "27.1.0", verified: 2026-10-17, notes: "--in-diff runs; a diff without Rust changes is a clean no-op; reliab-adapter-cargo-mutants turns missed mutants into findings. Baseline 2026-10-17, argusd store: 91.5% (333/364 viable; 31 missed, 9 timeouts, 25 unviable) in 44m at -j 4" }
  T5: { tool: in-process argusd on a temp socket, verified: 2026-10-18, notes: "test_host::Host: the real accept loop, connection and dispatch on a private endpoint (Unix socket or named pipe) in a temp dir, a file store there, scripted pane processes and clock, and a fixed two-commit repository" }
  T6: { tool: argus-protocol client }
  T7: { tool: proptest over arbitrary ClientMsg, verified: 2026-10-18, notes: "no OpenAPI spec exists. test_host::requests generates every ClientMsg variant against the host fixture (coverage held by exhaustive matches); test_host::tests::fuzz sends arbitrary sequences over the socket to a fresh host per case" }
  T8: { applicable: false, reason: "local IPC only; no network between argus and its store" }
  T9: { applicable: false, reason: "no external HTTP dependencies" }
  T10: { tool: SQLite hooks on the store's connection, verified: 2026-10-18, notes: "store::faults: a write stopped at any step (a writing statement prepared or a row written) or at its commit, a full disk (max_page_count), another writer's lock; store::tests::faults holds every store write to all-or-nothing, and the daemon to refusing a stopped write" }
  T11: { applicable: false, reason: "no logic lives in SQLite: no triggers, procedures, constraints or cascades in the schema (re-checked 2026-10-18); every store rule is Rust, tested by unit" }
  T12: { tool: cargo-llvm-cov }
  T13: { applicable: false, reason: "no read paths slated for rewrite" }
  T14: { tool: clippy, verified: 2026-10-17 }

commands:
  build: cargo build --workspace --locked
  analyzers: cargo clippy --workspace --all-targets --locked -- -D warnings
  # Everything but the transcripts, which `snapshots` runs, so a snapshot
  # diff is reported once.
  unit:
    run: cargo nextest run --locked --profile ci --no-fail-fast {impacted} -E 'not test(/^test_host::tests::/) and not test(/^store::tests::faults::/)'
    format: junit
    output: target/nextest/ci/junit.xml
  properties:
    # A crate with no properties yet selects none, which nextest fails by
    # default; that says nothing about the change.
    run: PROPTEST_CASES={cases} cargo nextest run --locked --profile props --no-fail-fast --no-tests=warn {impacted} -E 'test(/::properties::/) and not test(/^store::tests::faults::/)'
    format: junit
    output: target/nextest/props/junit.xml
  # reliab-adapter-cargo-mutants ships beside reliab and turns missed mutants
  # into findings. The old output goes first: cargo-mutants leaves it in place
  # when the diff has nothing to mutate.
  # Characterization (S2): what the daemon answers its clients' most-used
  # conversations; a diff is a finding for a human. INSTA_UPDATE=new writes
  # each mismatch as a pending .snap.new and never touches an accepted
  # snapshot; INSTA_PENDING_DIR keeps those files under .reliab/out, out of
  # the protected snapshot directories. reliab-adapter-insta labels each one
  # additive-only or values-changed. Old output goes first, so a failed build
  # cannot leave a stale JUnit file. The fuzz shares test_host::tests and is
  # api_fuzz's.
  # This, api_fuzz and faults_db run only argusd's tests, and argusd builds
  # on no workspace crate but argus-protocol, so inner and prepr skip all
  # three for a change to neither: about half of main's last 300 commits
  # (152 of 298), the client, the desktop window and the docs. That saves
  # about 35s of inner and 110s of prepr; nightly still runs them.
  snapshots:
    relevant_when: &daemon ["crates/argusd/**", "crates/argus-protocol/**", "Cargo.toml", "Cargo.lock", ".config/nextest.toml", "reliability-profile.yaml"]
    run: >-
      rm -rf .reliab/out/insta target/nextest/snapshots/junit.xml;
      INSTA_UPDATE=new INSTA_PENDING_DIR="$(pwd -W 2>/dev/null || pwd)/.reliab/out/insta"
      cargo nextest run --locked --profile snapshots --no-fail-fast -p argusd -E 'test(/^test_host::tests::/) and not test(/^test_host::tests::fuzz::/)';
      reliab-adapter-insta -exit $? -junit target/nextest/snapshots/junit.xml .reliab/out/insta .reliab/out/snapshots.json
    format: findings
    output: .reliab/out/snapshots.json
  # On-demand characterization (reliab characterize): the same conversations,
  # written to RELIAB_CAPTURE_DIR instead of asserted. It ignores the scope;
  # all of them take about 11s.
  characterize: cargo nextest run --locked --profile snapshots --no-fail-fast -p argusd -E 'test(/^test_host::tests::/) and not test(/^test_host::tests::fuzz::/)'
  # Arbitrary request sequences over the socket, a fresh host per case
  # (S3). About 100ms a case: 300 in inner, and each other tier's own count,
  # 1000 in prepr and 10000 at night. A failing case is saved under
  # proptest-regressions/ and replayed first on every run after.
  # Inner runs 300, not its 100, because the fuzz is its only check for a
  # crash one request in hundreds triggers: S3's acceptance plant (a
  # zero-row Resize) was caught in 10 of 14 runs at 100 cases, about 97%
  # is expected at 300, and 9 of 10 were caught when measured. That costs
  # about 20s more. Only this command: inner's properties keep 100.
  api_fuzz:
    relevant_when: *daemon
    run: >-
      case "$RELIAB_TIER" in inner) cases=300;; *) cases={cases};; esac;
      PROPTEST_CASES=$cases cargo nextest run --locked --profile api-fuzz --no-fail-fast -p argusd -E 'test(/^test_host::tests::fuzz::/)'
    format: junit
    output: target/nextest/api-fuzz/junit.xml
  # Store writes under faults (S4): every write the store makes, stopped at
  # each step and at its commit, must leave all of itself or none, and the
  # daemon must refuse it rather than hang up. The exhaustive pass takes
  # about 3s; the property, a store in a file with a full disk and another
  # writer's lock too, runs the tier's count. Kept out of unit and
  # properties so a finding is reported once.
  faults_db:
    relevant_when: *daemon
    run: PROPTEST_CASES={cases} cargo nextest run --locked --profile faults-db --no-fail-fast -p argusd -E 'test(/^store::tests::faults::/)'
    format: junit
    output: target/nextest/faults-db/junit.xml
  #
  # On Windows both mutation commands skip cfg(unix)-only functions, which a
  # Windows build never compiles, so their mutants could only survive there.
  # That code is NOT mutation-tested on Windows; it needs a Linux mutation run.
  # Skipped: transport.rs's `unix` module, pty/job.rs's kill_session and
  # review/diff.rs's file_bytes. Not skipped, because a cfg(windows) twin has
  # the same mutant names: pty/job.rs's unix end_process_tree and
  # program_command, which therefore still survive on Windows.
  # Changed code must score 80%. Measured 2026-10-19: main's Rust changes
  # since adoption (8cdb034..a0ff90d) scored 90.9%, 10 killed of 11 counted,
  # the one survivor equivalent (`|` for `^` on two disjoint job flags); the
  # store baseline is 91.5%. A change of a few mutants moves in big steps,
  # so one survivor in five falls short: that is a question for a person,
  # never a reason for a test written for the score. No mutation_baseline:
  # the cargo-mutants adapter writes no per-file counts to score a scope by.
  mutation_changed:
    threshold: 80
    run: >-
      rm -rf .reliab/out/mutants.out;
      set --;
      case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) set --
      --exclude-re 'connection/transport\.rs:[0-9]+:[0-9]+: .*\bunix::'
      --exclude-re 'pty/job\.rs:[0-9]+:[0-9]+: .*\bkill_session\b'
      --exclude-re 'review/diff\.rs:[0-9]+:[0-9]+: .*\bfile_bytes\b';; esac;
      git diff "$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD main)" > .reliab/out/change.diff &&
      cargo mutants "$@" --in-diff .reliab/out/change.diff --copy-target=false -j 4 -o .reliab/out;
      reliab-adapter-cargo-mutants -exit $? .reliab/out/mutants.out .reliab/out/mutation.json
    format: findings
    output: .reliab/out/mutation.json
  # Every mutant under RELIAB_SCOPE (reliab verify --only mutation_full --scope
  # <path>...): a directory becomes dir/**. With no scope it mutates the whole
  # workspace, which takes hours.
  mutation_full:
    run: >-
      rm -rf .reliab/out/mutants.out;
      set --;
      case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) set --
      --exclude-re 'connection/transport\.rs:[0-9]+:[0-9]+: .*\bunix::'
      --exclude-re 'pty/job\.rs:[0-9]+:[0-9]+: .*\bkill_session\b'
      --exclude-re 'review/diff\.rs:[0-9]+:[0-9]+: .*\bfile_bytes\b';; esac;
      for p in $RELIAB_SCOPE; do if [ -d "$p" ]; then p="${p%/}/**"; fi; set -- "$@" -f "$p"; done;
      cargo mutants "$@" --copy-target=false -j 4 -o .reliab/out;
      reliab-adapter-cargo-mutants -exit $? .reliab/out/mutants.out .reliab/out/mutation.json
    format: findings
    output: .reliab/out/mutation.json

impacted:
  all: --workspace
  map:
    - { glob: "crates/argus-protocol/**", args: -p argus-protocol }
    - { glob: "crates/argusd/**", args: -p argusd }
    - { glob: "crates/argus-client/**", args: -p argus }
    - { glob: "crates/argus-desktop/**", args: -p argus-desktop }

tiers:
  # The snapshots take about 11s and catch side effects before an agent stops;
  # the fuzz, about 30s at inner's 300 cases, catches a request that crashes,
  # hangs or goes unanswered; the store's faults, about 3s, a write left
  # half done.
  inner: { budget_seconds: 300, run: [build, analyzers, corpus, unit, snapshots, properties, api_fuzz, faults_db, spec_checks] }
  prepr: { budget_seconds: 1800 }

require_reviewer_verdict: true

corrections: []

# reliab stack profile for argus. See https://github.com/hbaldwin98/reliab
# Every filling is a claim until stage S0 verifies it on this codebase.
schemaVersion: 0.1.0
name: rust-workspace
starting_condition: maintained
verified_on: 2026-10-17

runtime:
  current: rust-stable

# A file matching none of these counts as product.
paths:
  product: ["crates/**", "Cargo.toml", "Cargo.lock"]
  tests: ["**/tests/**", "**/tests.rs", "fuzz/**", ".config/nextest.toml"]
  ignore: ["*.md", "LICENSE-*", "crates/argus-desktop/page/src/bindings/**", "crates/argus-desktop/assets/js/**"]

# Oracles that change only with human approval (R2).
protected_paths:
  - "**/proptest-regressions/**"
  - "crates/argusd/tests/fixtures/stores/**"
  - "**/snapshots/**"
  - "mutants.toml"

freshness_exclude: ["*.md"]

roles:
  T1: { tool: cargo-nextest, version: "0.9.148", verified: 2026-10-17, notes: "3306 tests in ~30s warm; JUnit via .config/nextest.toml profiles ci and props" }
  T2: { tool: proptest, verified: 2026-10-17, notes: "properties live in `mod properties` (10 today, all in argus-protocol); failing cases are saved under proptest-regressions/" }
  T3: { tool: insta, version: "1.49.0", verified: 2026-10-18, notes: "request/response transcripts over the IPC socket, five conversations in crates/argusd/src/test_host/tests; scrubbed and rendered by test_host::{scrub,render}, so a capture is plain text apart from insta" }
  T4: { tool: cargo-mutants, version: "27.1.0", verified: 2026-10-17, notes: "--in-diff runs; a diff without Rust changes is a clean no-op; reliab-adapter-cargo-mutants turns missed mutants into findings. Baseline 2026-10-17, argusd store: 91.5% (333/364 viable; 31 missed, 9 timeouts, 25 unviable) in 44m at -j 4" }
  T5: { tool: in-process argusd on a temp socket, verified: 2026-10-18, notes: "test_host::Host: the real accept loop, connection and dispatch on a private endpoint (Unix socket or named pipe) in a temp dir, a file store there, scripted pane processes and clock, and a fixed two-commit repository" }
  T6: { tool: argus-protocol client }
  T7: { tool: proptest over arbitrary ClientMsg, notes: "no OpenAPI spec exists; not built yet" }
  T8: { applicable: false, reason: "local IPC only; no network between argus and its store" }
  T9: { applicable: false, reason: "no external HTTP dependencies" }
  T10: { tool: fault-injecting SQLite connection wrapper, notes: "not built yet (S4)" }
  T11: { applicable: false, reason: "no logic lives in SQLite triggers or procedures" }
  T12: { tool: cargo-llvm-cov }
  T13: { applicable: false, reason: "no read paths slated for rewrite" }
  T14: { tool: clippy, verified: 2026-10-17 }

commands:
  build: cargo build --workspace --locked
  analyzers: cargo clippy --workspace --all-targets --locked -- -D warnings
  unit:
    run: cargo nextest run --locked --profile ci --no-fail-fast {impacted}
    format: junit
    output: target/nextest/ci/junit.xml
  properties:
    # A crate with no properties yet selects none, which nextest fails by
    # default; that says nothing about the change.
    run: PROPTEST_CASES={cases} cargo nextest run --locked --profile props --no-fail-fast --no-tests=warn {impacted} -E 'test(/::properties::/)'
    format: junit
    output: target/nextest/props/junit.xml
  # reliab-adapter-cargo-mutants ships beside reliab and turns missed mutants
  # into findings. The old output goes first: cargo-mutants leaves it in place
  # when the diff has nothing to mutate.
  # Characterization (S2): what the daemon answers its clients' most-used
  # conversations. Never writes a snapshot; a diff is a finding for a human.
  snapshots:
    run: INSTA_UPDATE=no cargo nextest run --locked --profile snapshots --no-fail-fast -p argusd -E 'test(/^test_host::tests::/)'
    format: junit
    output: target/nextest/snapshots/junit.xml
  #
  # On Windows both mutation commands skip cfg(unix)-only functions, which a
  # Windows build never compiles, so their mutants could only survive there.
  # That code is NOT mutation-tested on Windows; it needs a Linux mutation run.
  # Skipped: transport.rs's `unix` module, pty/job.rs's kill_session and
  # review/diff.rs's file_bytes. Not skipped, because a cfg(windows) twin has
  # the same mutant names: pty/job.rs's unix end_process_tree and
  # program_command, which therefore still survive on Windows.
  mutation_changed:
    run: >-
      rm -rf .reliab/out/mutants.out;
      set --;
      case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) set --
      --exclude-re 'connection/transport\.rs:[0-9]+:[0-9]+: .*\bunix::'
      --exclude-re 'pty/job\.rs:[0-9]+:[0-9]+: .*\bkill_session\b'
      --exclude-re 'review/diff\.rs:[0-9]+:[0-9]+: .*\bfile_bytes\b';; esac;
      git diff "$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD main)" > .reliab/out/change.diff &&
      cargo mutants "$@" --in-diff .reliab/out/change.diff --copy-target=false -j 4 -o .reliab/out;
      reliab-adapter-cargo-mutants -exit $? .reliab/out/mutants.out .reliab/out/mutation.json
    format: findings
    output: .reliab/out/mutation.json
  # Every mutant under RELIAB_SCOPE (reliab verify --only mutation_full --scope
  # <path>...): a directory becomes dir/**. With no scope it mutates the whole
  # workspace, which takes hours.
  mutation_full:
    run: >-
      rm -rf .reliab/out/mutants.out;
      set --;
      case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) set --
      --exclude-re 'connection/transport\.rs:[0-9]+:[0-9]+: .*\bunix::'
      --exclude-re 'pty/job\.rs:[0-9]+:[0-9]+: .*\bkill_session\b'
      --exclude-re 'review/diff\.rs:[0-9]+:[0-9]+: .*\bfile_bytes\b';; esac;
      for p in $RELIAB_SCOPE; do if [ -d "$p" ]; then p="${p%/}/**"; fi; set -- "$@" -f "$p"; done;
      cargo mutants "$@" --copy-target=false -j 4 -o .reliab/out;
      reliab-adapter-cargo-mutants -exit $? .reliab/out/mutants.out .reliab/out/mutation.json
    format: findings
    output: .reliab/out/mutation.json

impacted:
  all: --workspace
  map:
    - { glob: "crates/argus-protocol/**", args: -p argus-protocol }
    - { glob: "crates/argusd/**", args: -p argusd }
    - { glob: "crates/argus-client/**", args: -p argus }
    - { glob: "crates/argus-desktop/**", args: -p argus-desktop }

tiers:
  # The snapshots take about 11s and catch side effects before an agent stops.
  inner: { budget_seconds: 300, run: [build, analyzers, corpus, unit, snapshots, properties, spec_checks] }
  prepr: { budget_seconds: 900 }

corrections: []
